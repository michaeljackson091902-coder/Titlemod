name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
      - name: Make zips
        run: |
          mkdir out
          cp build/libs/*.jar out/
          (cd out && zip ../tilemod-build.zip *.jar)
          git archive --format=zip -o tilemod-source.zip HEAD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            tilemod-build.zip
            tilemod-source.zip
            build/libs/*.jar
